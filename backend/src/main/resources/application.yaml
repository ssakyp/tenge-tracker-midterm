server:
  port: ${PORT:3000}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tengetracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # keeps the session open while JSON is written so lazy tag lists can be serialized
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

app:
  jwt:
    # HS256 signing key, at least 32 characters. Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-tenge-tracker-2026-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Only needed when the React dev server calls the API from another origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
